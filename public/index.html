<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matthew's Badge Vault</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #09090b;
  --s1:       #18181b;
  --s2:       #27272a;
  --border:   #3f3f46;
  --border2:  #52525b;
  --text:     #fafafa;
  --text2:    #a1a1aa;
  --text3:    #71717a;
  --amber:    #f59e0b;
  --amber2:   #fbbf24;
  --blue:     #3b82f6;
  --green:    #22c55e;
  --pink:     #ec4899;
  --r-common:     #52525b;
  --r-uncommon:   #2563eb;
  --r-rare:       #d97706;
  --r-ultra:      #be185d;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', -apple-system, sans-serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── TOP BAR ── */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: rgba(9,9,11,0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 60px;
  display: flex; align-items: center; justify-content: space-between;
}
.topbar-brand {
  font-size: 1.05rem; font-weight: 800;
  letter-spacing: -0.3px;
  color: var(--text);
}
.topbar-brand span { color: var(--amber); }
.topbar-stats {
  display: flex; gap: 24px;
  font-size: 0.8rem; color: var(--text2);
}
.topbar-stats strong { color: var(--text); font-weight: 600; }

/* ── HERO ── */
.hero {
  padding: 48px 24px 32px;
  max-width: 1100px; margin: 0 auto;
  border-bottom: 1px solid var(--border);
}
.hero h1 {
  font-size: clamp(2rem, 5vw, 3.2rem);
  font-weight: 800;
  letter-spacing: -1.5px;
  line-height: 1.1;
  margin-bottom: 8px;
}
.hero h1 em {
  font-style: normal;
  background: linear-gradient(90deg, var(--amber) 0%, var(--amber2) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.hero-sub {
  font-size: 1rem; color: var(--text2); margin-bottom: 28px;
}
.stat-row {
  display: flex; flex-wrap: wrap; gap: 12px;
}
.stat-pill {
  background: var(--s1);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 18px;
  display: flex; flex-direction: column; gap: 2px;
}
.stat-pill-val {
  font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px;
  color: var(--text);
}
.stat-pill-label { font-size: 0.72rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; }

/* ── COUNTRY NAV ── */
.country-nav-wrap {
  position: sticky; top: 60px; z-index: 40;
  background: rgba(9,9,11,0.9);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
}
.country-nav {
  display: flex; gap: 4px;
  padding: 10px 20px;
  overflow-x: auto;
  scrollbar-width: none;
  max-width: 1100px; margin: 0 auto;
}
.country-nav::-webkit-scrollbar { display: none; }
.country-tab {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 14px;
  border-radius: 8px;
  border: 1px solid transparent;
  font-size: 0.82rem; font-weight: 600;
  color: var(--text2);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  background: transparent;
}
.country-tab:hover { background: var(--s1); color: var(--text); }
.country-tab.active {
  background: var(--s1);
  border-color: var(--border);
  color: var(--text);
}
.country-tab .flag { font-size: 1.1rem; }
.country-tab .count {
  background: var(--s2);
  color: var(--text3);
  font-size: 0.68rem;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 4px;
  min-width: 20px;
  text-align: center;
}
.country-tab.active .count { color: var(--amber); }

/* ── MAIN ── */
main {
  max-width: 1100px; margin: 0 auto;
  padding: 0 24px 60px;
}

/* ── COUNTRY SECTION ── */
.country-section { padding-top: 40px; }
.country-section.hidden { display: none; }

.country-header {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 28px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.country-flag-big { font-size: 2rem; }
.country-header-text h2 {
  font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px;
}
.country-header-text p { font-size: 0.8rem; color: var(--text3); margin-top: 2px; }

/* ── MAKE GROUP ── */
.make-group { margin-bottom: 36px; }
.make-header {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 16px;
}
.make-name {
  font-size: 0.85rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1px;
  color: var(--text2);
}
.make-line {
  flex: 1; height: 1px; background: var(--border);
}
.make-count {
  font-size: 0.72rem; color: var(--text3); font-weight: 600;
}

/* ── BADGE GRID ── */
.badge-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
}

/* ── BADGE CARD ── */
.badge-card {
  background: var(--s1);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
  position: relative;
}
.badge-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  border-color: var(--border2);
}
.badge-card[data-rarity="rare"] {
  border-color: #78350f;
}
.badge-card[data-rarity="rare"]:hover { border-color: var(--amber); }
.badge-card[data-rarity="ultra-rare"] {
  border-color: #831843;
}
.badge-card[data-rarity="ultra-rare"]:hover { border-color: var(--pink); }

.card-img-wrap {
  position: relative;
  aspect-ratio: 1;
  background: #111113;
  overflow: hidden;
}
.card-img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.3s;
}
.badge-card:hover .card-img { transform: scale(1.04); }
.card-img-placeholder {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  font-size: 3rem; color: var(--border2);
}
.rarity-dot {
  position: absolute; top: 8px; right: 8px;
  width: 8px; height: 8px; border-radius: 50%;
}
.rarity-dot.common     { background: var(--r-common); }
.rarity-dot.uncommon   { background: var(--r-uncommon); box-shadow: 0 0 6px var(--r-uncommon); }
.rarity-dot.rare       { background: var(--amber);  box-shadow: 0 0 8px var(--amber); }
.rarity-dot.ultra-rare { background: var(--pink);   box-shadow: 0 0 10px var(--pink); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

.card-info { padding: 12px; }
.card-badge-name {
  font-size: 0.82rem; font-weight: 600;
  color: var(--text);
  line-height: 1.35;
  margin-bottom: 6px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-meta {
  display: flex; align-items: center; justify-content: space-between;
  gap: 6px;
}
.rarity-tag {
  font-size: 0.65rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.5px;
  padding: 2px 7px; border-radius: 4px;
}
.rarity-tag.common     { background: #1c1c1f; color: var(--text3); }
.rarity-tag.uncommon   { background: #1e3a8a22; color: #93c5fd; border: 1px solid #1e3a8a; }
.rarity-tag.rare       { background: #78350f22; color: #fcd34d; border: 1px solid #78350f; }
.rarity-tag.ultra-rare { background: #83184322; color: #f9a8d4; border: 1px solid #831843; }
.card-value { font-size: 0.72rem; color: var(--green); font-weight: 600; }

/* ── MODAL ── */
.modal-bg {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 200;
  align-items: center; justify-content: center;
  padding: 20px;
}
.modal-bg.open { display: flex; }

.modal {
  background: var(--s1);
  border: 1px solid var(--border);
  border-radius: 20px;
  max-width: 480px; width: 100%;
  overflow: hidden;
  max-height: 90vh;
  overflow-y: auto;
  position: relative;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.modal-img {
  width: 100%;
  aspect-ratio: 4/3;
  object-fit: cover;
  display: block;
  background: #111113;
}
.modal-body { padding: 24px; }
.modal-top {
  display: flex; align-items: flex-start;
  justify-content: space-between; gap: 12px;
  margin-bottom: 16px;
}
.modal-title {
  font-size: 1.3rem; font-weight: 800;
  letter-spacing: -0.3px; line-height: 1.2;
}
.modal-close {
  flex-shrink: 0;
  background: var(--s2); border: 1px solid var(--border);
  color: var(--text2); border-radius: 8px;
  width: 32px; height: 32px;
  font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.modal-close:hover { background: var(--border); color: var(--text); }

.modal-make-row {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 20px;
}
.modal-flag { font-size: 1.1rem; }
.modal-make-text { font-size: 0.85rem; color: var(--text2); }

.modal-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.modal-chip {
  font-size: 0.72rem; font-weight: 600;
  padding: 4px 10px; border-radius: 6px;
  background: var(--s2); color: var(--text3);
  border: 1px solid var(--border);
}
.modal-chip.rarity-rare       { color: #fcd34d; border-color: #78350f; background: #78350f22; }
.modal-chip.rarity-uncommon   { color: #93c5fd; border-color: #1e3a8a; background: #1e3a8a22; }
.modal-chip.rarity-ultra-rare { color: #f9a8d4; border-color: #831843; background: #83184322; }
.modal-chip.rarity-common     { color: var(--text3); }
.modal-chip.value { color: var(--green); border-color: #14532d; background: #14532d22; }

.modal-section { margin-bottom: 16px; }
.modal-label {
  font-size: 0.68rem; text-transform: uppercase; letter-spacing: 1px;
  color: var(--text3); font-weight: 700; margin-bottom: 6px;
}
.modal-p { font-size: 0.88rem; color: var(--text2); line-height: 1.65; }
.modal-funfact {
  background: var(--bg);
  border: 1px solid var(--border);
  border-left: 3px solid var(--amber);
  border-radius: 0 8px 8px 0;
  padding: 12px 14px;
  font-size: 0.85rem;
  color: #fef3c7;
  line-height: 1.6;
}

/* ── EMPTY / LOADING ── */
.loading {
  text-align: center; padding: 80px 20px;
  color: var(--text3);
}
.spinner {
  width: 36px; height: 36px;
  border: 2px solid var(--border);
  border-top-color: var(--amber);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin: 0 auto 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">Matthew's <span>Badge Vault</span></div>
  <div class="topbar-stats" id="topbar-stats"></div>
</div>

<div class="hero">
  <h1>The <em>Collection.</em></h1>
  <p class="hero-sub">Every badge pulled, identified, and logged.</p>
  <div class="stat-row" id="stat-row">
    <div class="stat-pill"><div class="stat-pill-val">—</div><div class="stat-pill-label">Badges</div></div>
  </div>
</div>

<div class="country-nav-wrap">
  <div class="country-nav" id="country-nav"></div>
</div>

<main id="main">
  <div class="loading"><div class="spinner"></div>Loading the vault…</div>
</main>

<!-- Modal -->
<div class="modal-bg" id="modal-bg">
  <div class="modal" id="modal">
    <img class="modal-img" id="modal-img" src="" alt="">
    <div class="modal-body">
      <div class="modal-top">
        <div class="modal-title" id="modal-title"></div>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <div class="modal-make-row">
        <span class="modal-flag" id="modal-flag"></span>
        <span class="modal-make-text" id="modal-make-text"></span>
      </div>
      <div class="modal-chips" id="modal-chips"></div>
      <div class="modal-section">
        <div class="modal-label">About this badge</div>
        <p class="modal-p" id="modal-desc"></p>
      </div>
      <div class="modal-section" id="modal-fact-wrap">
        <div class="modal-label">Fun fact</div>
        <div class="modal-funfact" id="modal-fact"></div>
      </div>
    </div>
  </div>
</div>

<script>
const GITHUB_RAW = 'https://raw.githubusercontent.com/ClawSpivak/matthew-badges/main';

// ── Make → Country map ──
const MAKE_COUNTRY = {
  ford:'United States', chevrolet:'United States', chevy:'United States',
  dodge:'United States', pontiac:'United States', oldsmobile:'United States',
  buick:'United States', cadillac:'United States', lincoln:'United States',
  mercury:'United States', amc:'United States', plymouth:'United States',
  chrysler:'United States', jeep:'United States', packard:'United States',
  studebaker:'United States', hudson:'United States', nash:'United States',
  willys:'United States', duesenberg:'United States', cord:'United States',
  auburn:'United States', stutz:'United States', raceline:'United States',
  'jim beam':'United States', beam:'United States', kaiser:'United States',

  porsche:'Germany', bmw:'Germany', mercedes:'Germany', 'mercedes-benz':'Germany',
  audi:'Germany', opel:'Germany', volkswagen:'Germany', vw:'Germany',

  maserati:'Italy', ferrari:'Italy', lamborghini:'Italy',
  'alfa romeo':'Italy', fiat:'Italy', lancia:'Italy',

  toyota:'Japan', honda:'Japan', nissan:'Japan', datsun:'Japan',
  mazda:'Japan', subaru:'Japan', mitsubishi:'Japan', suzuki:'Japan', isuzu:'Japan',

  jaguar:'United Kingdom', 'land rover':'United Kingdom',
  'rolls royce':'United Kingdom', 'rolls-royce':'United Kingdom',
  bentley:'United Kingdom', triumph:'United Kingdom', mg:'United Kingdom',
  'austin-healey':'United Kingdom', 'aston martin':'United Kingdom',
  lotus:'United Kingdom', mini:'United Kingdom',

  peugeot:'France', renault:'France', citroën:'France', citroen:'France',

  volvo:'Sweden', saab:'Sweden',

  hyundai:'South Korea', kia:'South Korea',
};

const COUNTRY_META = {
  'United States':  { flag:'🇺🇸', sort:0 },
  'Germany':        { flag:'🇩🇪', sort:1 },
  'Italy':          { flag:'🇮🇹', sort:2 },
  'Japan':          { flag:'🇯🇵', sort:3 },
  'United Kingdom': { flag:'🇬🇧', sort:4 },
  'France':         { flag:'🇫🇷', sort:5 },
  'Sweden':         { flag:'🇸🇪', sort:6 },
  'South Korea':    { flag:'🇰🇷', sort:7 },
  'Other':          { flag:'🌍', sort:99 },
};

const RARITY_ORDER = ['ultra-rare','rare','uncommon','common'];
const RARITY_LABEL = {
  'ultra-rare':'⭐ Ultra Rare','rare':'🥇 Rare',
  'uncommon':'💙 Uncommon','common':'Common',
};

function getCountry(make) {
  if (!make) return 'Other';
  const key = make.toLowerCase().trim();
  return MAKE_COUNTRY[key] || 'Other';
}
function rarity(b) { return (b.rarity || 'common').toLowerCase().replace(' ','-'); }
function photoUrl(p) {
  if (!p) return null;
  return `${GITHUB_RAW}/app/photos/${p.replace(/^\/photos\//,'')}`;
}
function fmtDate(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

let allBadges = [];
let activeCountry = 'all';

async function load() {
  try {
    const res  = await fetch('/api/badges');
    const data = await res.json();
    allBadges  = (data.badges || []).sort((a,b)=>{
      const ai = RARITY_ORDER.indexOf(rarity(a));
      const bi = RARITY_ORDER.indexOf(rarity(b));
      return (ai<0?99:ai)-(bi<0?99:bi);
    });
    render();
  } catch(e) {
    document.getElementById('main').innerHTML =
      '<div class="loading">Couldn\'t load. Try refreshing!</div>';
  }
}

function groupData() {
  // {country: {make: [badges]}}
  const tree = {};
  allBadges.forEach(b => {
    const country = getCountry(b.make);
    const make    = b.make || 'Unknown';
    if (!tree[country]) tree[country] = {};
    if (!tree[country][make]) tree[country][make] = [];
    tree[country][make].push(b);
  });
  return tree;
}

function render() {
  const tree = groupData();

  // Stats
  const total  = allBadges.length;
  const makes  = new Set(allBadges.map(b=>b.make).filter(Boolean)).size;
  const countries = Object.keys(tree).length;
  const rares  = allBadges.filter(b=>['rare','ultra-rare'].includes(rarity(b))).length;

  document.getElementById('topbar-stats').innerHTML =
    `<span><strong>${total}</strong> badges</span>
     <span><strong>${makes}</strong> makes</span>
     <span><strong>${countries}</strong> countries</span>`;

  document.getElementById('stat-row').innerHTML = `
    <div class="stat-pill"><div class="stat-pill-val">${total}</div><div class="stat-pill-label">Badges</div></div>
    <div class="stat-pill"><div class="stat-pill-val">${makes}</div><div class="stat-pill-label">Makes</div></div>
    <div class="stat-pill"><div class="stat-pill-val">${countries}</div><div class="stat-pill-label">Countries</div></div>
    <div class="stat-pill"><div class="stat-pill-val">${rares}</div><div class="stat-pill-label">Rare+</div></div>
  `;

  // Country nav
  const sortedCountries = Object.keys(tree).sort((a,b)=>
    ((COUNTRY_META[a]||{sort:99}).sort) - ((COUNTRY_META[b]||{sort:99}).sort)
  );

  document.getElementById('country-nav').innerHTML =
    `<button class="country-tab active" data-country="all" onclick="setCountry('all',this)">
       All <span class="count">${total}</span>
     </button>` +
    sortedCountries.map(c => {
      const meta  = COUNTRY_META[c] || {flag:'🌍'};
      const count = Object.values(tree[c]).flat().length;
      return `<button class="country-tab" data-country="${c}" onclick="setCountry('${c}',this)">
        <span class="flag">${meta.flag}</span> ${c} <span class="count">${count}</span>
      </button>`;
    }).join('');

  // Main content
  document.getElementById('main').innerHTML = sortedCountries.map(country => {
    const meta   = COUNTRY_META[country] || {flag:'🌍'};
    const makes  = Object.keys(tree[country]).sort();
    const total  = Object.values(tree[country]).flat().length;
    return `
    <section class="country-section" id="country-${country.replace(/ /g,'_')}" data-country="${country}">
      <div class="country-header">
        <div class="country-flag-big">${meta.flag}</div>
        <div class="country-header-text">
          <h2>${country}</h2>
          <p>${total} badge${total!==1?'s':''} · ${makes.length} make${makes.length!==1?'s':''}</p>
        </div>
      </div>
      ${makes.map(make => {
        const badges = tree[country][make];
        return `
        <div class="make-group">
          <div class="make-header">
            <span class="make-name">${make}</span>
            <div class="make-line"></div>
            <span class="make-count">${badges.length}</span>
          </div>
          <div class="badge-grid">
            ${badges.map(b => badgeCard(b)).join('')}
          </div>
        </div>`;
      }).join('')}
    </section>`;
  }).join('');
}

function badgeCard(b) {
  const r    = rarity(b);
  const pUrl = photoUrl(b.photo);
  const img  = pUrl
    ? `<img class="card-img" src="${pUrl}" alt="" loading="lazy" onerror="this.parentNode.innerHTML='<div class=card-img-placeholder>🏅</div>'">`
    : `<div class="card-img-placeholder">🏅</div>`;
  return `
  <div class="badge-card" data-rarity="${r}" onclick="openModal('${b.id}')">
    <div class="card-img-wrap">
      ${img}
      <div class="rarity-dot ${r}"></div>
    </div>
    <div class="card-info">
      <div class="card-badge-name">${b.badge_name||'Unknown Badge'}</div>
      <div class="card-meta">
        <span class="rarity-tag ${r}">${RARITY_LABEL[r]||r}</span>
      </div>
    </div>
  </div>`;
}

function setCountry(country, btn) {
  activeCountry = country;
  document.querySelectorAll('.country-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.country-section').forEach(s=>{
    if (country === 'all' || s.dataset.country === country) {
      s.classList.remove('hidden');
    } else {
      s.classList.add('hidden');
    }
  });
}

function openModal(id) {
  const b = allBadges.find(x=>x.id===id);
  if (!b) return;
  const r      = rarity(b);
  const pUrl   = photoUrl(b.photo);
  const country = getCountry(b.make);
  const flag   = (COUNTRY_META[country]||{flag:'🌍'}).flag;

  const img = document.getElementById('modal-img');
  if (pUrl) { img.src = pUrl; img.style.display='block'; }
  else       { img.style.display='none'; }

  document.getElementById('modal-title').textContent    = b.badge_name||'Unknown Badge';
  document.getElementById('modal-flag').textContent     = flag;
  document.getElementById('modal-make-text').textContent =
    [b.make, b.model, b.years].filter(Boolean).join(' · ');

  document.getElementById('modal-chips').innerHTML =
    `<span class="modal-chip rarity-${r}">${RARITY_LABEL[r]||r}</span>` +
    (b.confidence     ? `<span class="modal-chip">${b.confidence} confidence</span>` : '') +
    (b.added          ? `<span class="modal-chip">${fmtDate(b.added)}</span>` : '');

  document.getElementById('modal-desc').textContent = b.description||'';

  const factWrap = document.getElementById('modal-fact-wrap');
  const factEl   = document.getElementById('modal-fact');
  if (b.fun_fact) {
    factEl.textContent = b.fun_fact;
    factWrap.style.display = 'block';
  } else {
    factWrap.style.display = 'none';
  }

  document.getElementById('modal-bg').classList.add('open');
}

document.getElementById('modal-close').onclick = ()=>
  document.getElementById('modal-bg').classList.remove('open');
document.getElementById('modal-bg').onclick = e=>{
  if (e.target===document.getElementById('modal-bg'))
    document.getElementById('modal-bg').classList.remove('open');
};

load();
</script>
</body>
</html>
