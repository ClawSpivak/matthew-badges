<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Badge Vault</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #020917;
  --bg2:       #040e24;
  --card:      rgba(8,20,50,0.7);
  --card-hover:rgba(10,26,62,0.9);
  --border:    rgba(56,110,200,0.18);
  --border2:   rgba(96,165,250,0.4);
  --blue:      #3b82f6;
  --blue2:     #60a5fa;
  --blue3:     #93c5fd;
  --cyan:      #22d3ee;
  --text:      #eef4ff;
  --text2:     #7da5d0;
  --text3:     #3d6080;
  --gold:      #f59e0b;
  --gold2:     #fbbf24;
  --pink:      #e879f9;
  --green:     #34d399;
}

html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', -apple-system, sans-serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed; top: -20%; left: 50%; transform: translateX(-50%);
  width: 900px; height: 500px;
  background: radial-gradient(ellipse, rgba(59,130,246,0.1) 0%, transparent 70%);
  pointer-events: none; z-index: 0;
}

/* ── TOP BAR ── */
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(2,9,23,0.8);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border-bottom: 1px solid var(--border);
  padding: 0 32px; height: 64px;
  display: flex; align-items: center; justify-content: space-between;
}
.topbar-brand {
  font-size: 1rem; font-weight: 800;
  background: linear-gradient(90deg, var(--text) 0%, var(--blue3) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.topbar-stats { display: flex; gap: 28px; font-size: 0.78rem; color: var(--text2); }
.topbar-stats strong { color: var(--blue2); font-weight: 700; }

/* ── HERO ── */
.hero {
  position: relative; z-index: 1;
  padding: 72px 32px 48px;
  max-width: 1200px; margin: 0 auto;
}
.hero-eyebrow {
  font-size: 0.72rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 3px;
  color: var(--blue2); margin-bottom: 16px;
  display: flex; align-items: center; gap: 10px;
}
.hero-eyebrow::before {
  content: ''; display: inline-block;
  width: 24px; height: 2px;
  background: var(--blue2); border-radius: 2px;
}
.hero h1 {
  font-size: clamp(2.6rem, 6vw, 4.5rem);
  font-weight: 900; letter-spacing: -2px; line-height: 1.0; margin-bottom: 16px;
}
.hero h1 .gradient-text {
  background: linear-gradient(135deg, var(--blue2) 0%, var(--cyan) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.hero-sub { font-size: 1.05rem; color: var(--text2); max-width: 480px; line-height: 1.6; margin-bottom: 40px; }
.stat-row { display: flex; flex-wrap: wrap; gap: 12px; }
.stat-pill {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 14px 22px; display: flex; flex-direction: column; gap: 3px;
  backdrop-filter: blur(12px); transition: border-color 0.2s, transform 0.2s;
}
.stat-pill:hover { border-color: var(--border2); transform: translateY(-2px); }
.stat-pill-val {
  font-size: 1.6rem; font-weight: 900; letter-spacing: -1px;
  background: linear-gradient(135deg, var(--text) 0%, var(--blue3) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.stat-pill-label { font-size: 0.68rem; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }

/* ── MAIN CONTENT AREA ── */
.content {
  position: relative; z-index: 1;
  max-width: 1200px; margin: 0 auto;
  padding: 0 32px 80px;
}

/* ── BREADCRUMB ── */
.breadcrumb {
  display: none;
  align-items: center; gap: 8px;
  margin-bottom: 32px;
  font-size: 0.82rem; color: var(--text2);
}
.breadcrumb.visible { display: flex; }
.breadcrumb-btn {
  background: var(--card); border: 1px solid var(--border);
  color: var(--blue2); border-radius: 8px;
  padding: 6px 14px; font-size: 0.8rem; font-weight: 600;
  cursor: pointer; transition: all 0.15s;
  display: flex; align-items: center; gap: 6px;
}
.breadcrumb-btn:hover { background: var(--card-hover); border-color: var(--border2); }
.breadcrumb-sep { color: var(--text3); }
.breadcrumb-current { color: var(--text); font-weight: 600; }

/* ── FLAG MATRIX ── */
.flag-matrix {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

/* ── FLAG CARD (flip) ── */
.flag-card {
  aspect-ratio: 3/2;
  perspective: 1200px;
  cursor: pointer;
}
.flag-card-inner {
  width: 100%; height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.65s cubic-bezier(0.4,0,0.2,1);
}
.flag-card.flipped .flag-card-inner { transform: rotateY(180deg); }

.flag-front, .flag-back {
  position: absolute; inset: 0;
  border-radius: 18px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  overflow: hidden;
}

/* FRONT — flag image */
.flag-front {
  border: 1px solid var(--border);
  background: #0a1628;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.flag-card:hover .flag-front {
  border-color: var(--border2);
  box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(96,165,250,0.2);
}
.flag-img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.4s ease;
}
.flag-card:hover .flag-img { transform: scale(1.04); }
.flag-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(2,9,23,0.85) 0%, rgba(2,9,23,0.1) 60%, transparent 100%);
  display: flex; flex-direction: column;
  justify-content: flex-end;
  padding: 16px;
}
.flag-country-name {
  font-size: 1rem; font-weight: 800; letter-spacing: -0.3px;
  color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.6);
}
.flag-badge-count {
  font-size: 0.72rem; color: rgba(255,255,255,0.65);
  margin-top: 2px; font-weight: 500;
}
.flag-hint {
  position: absolute; top: 12px; right: 12px;
  background: rgba(0,0,0,0.5); backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 6px; padding: 3px 8px;
  font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
  color: rgba(255,255,255,0.7);
}

/* BACK — brand logos */
.flag-back {
  transform: rotateY(180deg);
  background: #040e24;
  border: 1px solid rgba(96,165,250,0.25);
  display: flex; flex-direction: column;
  padding: 14px;
  box-shadow: 0 0 40px rgba(59,130,246,0.08) inset;
}
.flag-back-header {
  font-size: 0.62rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 1.5px; color: var(--blue2);
  margin-bottom: 10px; flex-shrink: 0;
}
.brand-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
  gap: 8px;
  flex: 1; align-content: center;
}
.brand-btn {
  aspect-ratio: 1;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(56,110,200,0.2);
  border-radius: 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4px; padding: 6px;
  cursor: pointer; transition: all 0.18s;
}
.brand-btn:hover {
  background: rgba(59,130,246,0.15);
  border-color: rgba(96,165,250,0.5);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.4);
}
.brand-btn-logo {
  width: 28px; height: 28px;
  object-fit: contain;
  filter: brightness(0) invert(1) opacity(0.8);
}
.brand-btn-name {
  font-size: 0.48rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.5px; color: var(--text3);
  text-align: center; line-height: 1.2;
  display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
}
.brand-btn:hover .brand-btn-name { color: var(--blue3); }
.brand-btn:hover .brand-btn-logo { opacity: 1; filter: brightness(0) invert(1); }

/* No-logo fallback */
.brand-btn-letter {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.9rem; font-weight: 800; color: var(--blue2);
}

/* ── BADGE GRID VIEW ── */
.badge-grid-view { display: none; }
.badge-grid-view.visible { display: block; }
.flag-matrix-view { display: block; }
.flag-matrix-view.hidden { display: none; }

.section-heading {
  display: flex; align-items: center; gap: 14px;
  margin-bottom: 28px; padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}
.section-heading-logo {
  width: 44px; height: 44px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center; padding: 6px;
  flex-shrink: 0;
}
.section-heading-logo img {
  width: 100%; height: 100%; object-fit: contain;
  filter: brightness(0) invert(1) opacity(0.85);
}
.section-heading-text h2 { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.5px; }
.section-heading-text p { font-size: 0.78rem; color: var(--text3); margin-top: 3px; }

.badge-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
}

/* ── BADGE CARD ── */
.badge-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  overflow: hidden; cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s, background 0.2s;
  backdrop-filter: blur(12px);
}
.badge-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(96,165,250,0.25);
  background: var(--card-hover); border-color: var(--border2);
}
.badge-card[data-rarity="rare"] { border-color: rgba(245,158,11,0.2); }
.badge-card[data-rarity="rare"]:hover { border-color: rgba(245,158,11,0.6); box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 30px rgba(245,158,11,0.12); }
.badge-card[data-rarity="ultra-rare"] { border-color: rgba(232,121,249,0.2); }
.badge-card[data-rarity="ultra-rare"]:hover { border-color: rgba(232,121,249,0.6); box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 30px rgba(232,121,249,0.15); }
.card-img-wrap { position: relative; aspect-ratio: 4/3; background: #030b1c; overflow: hidden; }
.card-img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }
.badge-card:hover .card-img { transform: scale(1.06); }
.card-img-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 3.5rem; color: var(--border2); }
.card-img-gradient { position: absolute; inset: 0; background: linear-gradient(to top, rgba(2,9,23,0.7) 0%, transparent 50%); pointer-events: none; }
.rarity-badge {
  position: absolute; top: 10px; right: 10px;
  font-size: 0.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px;
  padding: 3px 8px; border-radius: 6px; backdrop-filter: blur(8px);
}
.rarity-badge.common     { background: rgba(30,50,80,0.8); color: var(--text3); }
.rarity-badge.uncommon   { background: rgba(34,211,238,0.15); color: var(--cyan); border: 1px solid rgba(34,211,238,0.3); }
.rarity-badge.rare       { background: rgba(245,158,11,0.15); color: var(--gold2); border: 1px solid rgba(245,158,11,0.3); }
.rarity-badge.ultra-rare { background: rgba(232,121,249,0.15); color: var(--pink); border: 1px solid rgba(232,121,249,0.3); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
.card-info { padding: 14px 16px 16px; }
.card-badge-name { font-size: 0.88rem; font-weight: 600; color: var(--text); line-height: 1.4; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-make { font-size: 0.72rem; color: var(--text2); font-weight: 500; }

/* ── MODAL ── */
.modal-bg {
  display: none; position: fixed; inset: 0;
  background: rgba(0,5,20,0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  z-index: 200; align-items: center; justify-content: center; padding: 20px;
}
.modal-bg.open { display: flex; }
.modal {
  background: #050f26; border: 1px solid rgba(96,165,250,0.2);
  border-radius: 24px; max-width: 520px; width: 100%;
  overflow: hidden; max-height: 92vh; overflow-y: auto; position: relative;
  box-shadow: 0 40px 120px rgba(0,0,0,0.8), 0 0 60px rgba(59,130,246,0.08);
  scrollbar-width: thin; scrollbar-color: var(--border) transparent;
}
.modal-img-wrap { position: relative; width: 100%; aspect-ratio: 4/3; background: #020810; overflow: hidden; }
.modal-img { width: 100%; height: 100%; object-fit: cover; display: block; }
.modal-img-gradient {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(5,15,38,1) 0%, rgba(5,15,38,0.3) 40%, transparent 100%);
  pointer-events: none;
}
.modal-img-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 20px 24px 4px; }
.modal-img-rarity {
  font-size: 0.62rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
  padding: 3px 10px; border-radius: 6px; display: inline-block; margin-bottom: 8px;
}
.modal-img-rarity.common     { background: rgba(30,50,80,0.9); color: var(--text3); }
.modal-img-rarity.uncommon   { background: rgba(34,211,238,0.2); color: var(--cyan); border: 1px solid rgba(34,211,238,0.4); }
.modal-img-rarity.rare       { background: rgba(245,158,11,0.2); color: var(--gold2); border: 1px solid rgba(245,158,11,0.4); }
.modal-img-rarity.ultra-rare { background: rgba(232,121,249,0.2); color: var(--pink); border: 1px solid rgba(232,121,249,0.4); }
.modal-body { padding: 20px 24px 28px; }
.modal-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
.modal-title { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.4px; line-height: 1.2; }
.modal-close {
  flex-shrink: 0; background: rgba(30,50,80,0.6); border: 1px solid var(--border);
  color: var(--text2); border-radius: 10px; width: 34px; height: 34px;
  font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s;
}
.modal-close:hover { background: rgba(59,130,246,0.2); border-color: var(--border2); color: var(--blue2); }
.modal-make { font-size: 0.82rem; color: var(--text2); margin-bottom: 18px; display: flex; align-items: center; gap: 6px; }
.modal-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.modal-chip { font-size: 0.7rem; font-weight: 600; padding: 4px 10px; border-radius: 7px; background: rgba(30,50,80,0.6); color: var(--text3); border: 1px solid var(--border); }
.modal-section { margin-bottom: 18px; }
.modal-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text3); font-weight: 700; margin-bottom: 7px; }
.modal-p { font-size: 0.9rem; color: var(--text2); line-height: 1.7; }
.modal-funfact {
  background: rgba(59,130,246,0.06); border: 1px solid rgba(59,130,246,0.2);
  border-left: 3px solid var(--blue2); border-radius: 0 10px 10px 0;
  padding: 14px 16px; font-size: 0.87rem; color: #c5daff; line-height: 1.65;
}

/* ── LOADING ── */
.loading { text-align: center; padding: 100px 20px; color: var(--text3); }
.spinner {
  width: 40px; height: 40px; border: 2px solid rgba(59,130,246,0.15);
  border-top-color: var(--blue2); border-radius: 50%;
  animation: spin 0.8s linear infinite; margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── RESPONSIVE ── */
@media (max-width: 900px) {
  .flag-matrix { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 600px) {
  .topbar { padding: 0 16px; }
  .hero { padding: 48px 16px 40px; }
  .content { padding: 0 16px 60px; }
  .flag-matrix { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .badge-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .topbar-stats { gap: 14px; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">The Badge Vault</div>
  <div class="topbar-stats" id="topbar-stats"></div>
</div>

<div class="hero">
  <div class="hero-eyebrow">Car Emblem Collection</div>
  <h1>The <span class="gradient-text">Badge Vault.</span></h1>
  <p class="hero-sub">Car emblems found, identified and catalogued by a legendary 7yo.</p>
  <div class="stat-row" id="stat-row">
    <div class="stat-pill"><div class="stat-pill-val">—</div><div class="stat-pill-label">Badges</div></div>
  </div>
</div>

<div class="content">
  <!-- Breadcrumb -->
  <div class="breadcrumb" id="breadcrumb">
    <button class="breadcrumb-btn" id="bc-home" onclick="goHome()">← All Countries</button>
    <span class="breadcrumb-sep" id="bc-sep-1">/</span>
    <span class="breadcrumb-current" id="bc-country"></span>
    <span class="breadcrumb-sep" id="bc-sep-2" style="display:none">/</span>
    <span class="breadcrumb-current" id="bc-brand" style="display:none"></span>
  </div>

  <!-- Flag matrix -->
  <div class="flag-matrix-view" id="flag-matrix-view">
    <div class="loading"><div class="spinner"></div>Loading the vault…</div>
  </div>

  <!-- Badge grid -->
  <div class="badge-grid-view" id="badge-grid-view">
    <div class="section-heading" id="section-heading"></div>
    <div class="badge-grid" id="badge-grid"></div>
  </div>
</div>

<!-- Modal -->
<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <div class="modal-img-wrap">
      <img class="modal-img" id="modal-img" src="" alt="">
      <div class="modal-img-gradient"></div>
      <div class="modal-img-overlay">
        <div class="modal-img-rarity" id="modal-img-rarity"></div>
      </div>
    </div>
    <div class="modal-body">
      <div class="modal-top">
        <div class="modal-title" id="modal-title"></div>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <div class="modal-make" id="modal-make"></div>
      <div class="modal-chips" id="modal-chips"></div>
      <div class="modal-section">
        <div class="modal-label">About this badge</div>
        <p class="modal-p" id="modal-desc"></p>
      </div>
      <div class="modal-section" id="modal-fact-wrap">
        <div class="modal-label">Fun fact</div>
        <div class="modal-funfact" id="modal-fact"></div>
      </div>
    </div>
  </div>
</div>

<script>
const GITHUB_RAW = 'https://raw.githubusercontent.com/ClawSpivak/matthew-badges/main';
const LOGO_BASE  = 'https://cdn.jsdelivr.net/gh/filippofilip95/car-logos-dataset@master/logos/optimized';

const MAKE_COUNTRY = {
  ford:'United States', chevrolet:'United States', chevy:'United States',

  mercury:'United States', amc:'United States', plymouth:'United States',
  chrysler:'United States', jeep:'United States', packard:'United States',
  studebaker:'United States', hudson:'United States', nash:'United States',
  willys:'United States', duesenberg:'United States', cord:'United States',
  auburn:'United States', stutz:'United States', raceline:'United States',
  'harley-davidson':'United States', kaiser:'United States',

  porsche:'Germany', bmw:'Germany', mercedes:'Germany', 'mercedes-benz':'Germany',
  audi:'Germany', opel:'Germany', volkswagen:'Germany', vw:'Germany',

  maserati:'Italy', ferrari:'Italy', lamborghini:'Italy',
  'alfa romeo':'Italy', fiat:'Italy', lancia:'Italy',

  toyota:'Japan', honda:'Japan', nissan:'Japan', datsun:'Japan',

  jaguar:'United Kingdom', 'land rover':'United Kingdom',
  'rolls royce':'United Kingdom', 'rolls-royce':'United Kingdom',
  bentley:'United Kingdom', triumph:'United Kingdom', mg:'United Kingdom',
  'austin-healey':'United Kingdom', 'aston martin':'United Kingdom',
  lotus:'United Kingdom', mini:'United Kingdom',

  peugeot:'France', renault:'France', citroën:'France', citroen:'France',

  volvo:'Sweden', saab:'Sweden', 'saab-scania':'Sweden',

  hyundai:'South Korea', kia:'South Korea',
};

const COUNTRY_FLAG_CODE = {
  'United States':'us', 'Germany':'de', 'Italy':'it', 'Japan':'jp',
  'United Kingdom':'gb', 'France':'fr', 'Sweden':'se', 'South Korea':'kr',
};

const COUNTRY_SORT = {
  'United States':0,'Germany':1,'Italy':2,'Japan':3,
  'United Kingdom':4,'France':5,'Sweden':6,'South Korea':7,'Other':99,
};

const BRAND_LOGO = {
  'ford':`${LOGO_BASE}/ford.png`, 'chevrolet':`${LOGO_BASE}/chevrolet.png`,
  'dodge':`${LOGO_BASE}/dodge.png`, 'pontiac':`${LOGO_BASE}/pontiac.png`,
  'cadillac':`${LOGO_BASE}/cadillac.png`, 'buick':`${LOGO_BASE}/buick.png`,
  'lincoln':`${LOGO_BASE}/lincoln.png`, 'chrysler':`${LOGO_BASE}/chrysler.png`,
  'jeep':`${LOGO_BASE}/jeep.png`, 'harley-davidson':`${LOGO_BASE}/harley-davidson.png`,
  'porsche':`${LOGO_BASE}/porsche.png`, 'bmw':`${LOGO_BASE}/bmw.png`,
  'mercedes':`${LOGO_BASE}/mercedes-benz.png`, 'mercedes-benz':`${LOGO_BASE}/mercedes-benz.png`,
  'audi':`${LOGO_BASE}/audi.png`, 'opel':`${LOGO_BASE}/opel.png`,
  'volkswagen':`${LOGO_BASE}/volkswagen.png`, 'vw':`${LOGO_BASE}/volkswagen.png`,
  'ferrari':`${LOGO_BASE}/ferrari.png`, 'lamborghini':`${LOGO_BASE}/lamborghini.png`,
  'maserati':`${LOGO_BASE}/maserati.png`, 'alfa romeo':`${LOGO_BASE}/alfa-romeo.png`,
  'fiat':`${LOGO_BASE}/fiat.png`, 'toyota':`${LOGO_BASE}/toyota.png`,
  'honda':`${LOGO_BASE}/honda.png`, 'nissan':`${LOGO_BASE}/nissan.png`,
  'datsun':`${LOGO_BASE}/nissan.png`, 'mazda':`${LOGO_BASE}/mazda.png`,
  'subaru':`${LOGO_BASE}/subaru.png`, 'mitsubishi':`${LOGO_BASE}/mitsubishi.png`,
  'jaguar':`${LOGO_BASE}/jaguar.png`, 'land rover':`${LOGO_BASE}/land-rover.png`,
  'rolls-royce':`${LOGO_BASE}/rolls-royce.png`, 'rolls royce':`${LOGO_BASE}/rolls-royce.png`,
  'bentley':`${LOGO_BASE}/bentley.png`, 'aston martin':`${LOGO_BASE}/aston-martin.png`,
  'mini':`${LOGO_BASE}/mini.png`, 'volvo':`${LOGO_BASE}/volvo.png`,
  'saab':`${LOGO_BASE}/saab.png`, 'saab-scania':`${LOGO_BASE}/saab.png`,
  'peugeot':`${LOGO_BASE}/peugeot.png`, 'renault':`${LOGO_BASE}/renault.png`,
};

const RARITY_ORDER = ['ultra-rare','rare','uncommon','common'];
const RARITY_LABEL = { 'ultra-rare':'Ultra Rare','rare':'Rare','uncommon':'Uncommon','common':'Common' };

function getCountry(make) {
  return make ? (MAKE_COUNTRY[make.toLowerCase().trim()] || 'Other') : 'Other';
}
function rarity(b) { return (b.rarity||'common').toLowerCase().replace(/[\s_]+/g,'-'); }
function photoUrl(p) {
  return p ? `${GITHUB_RAW}/app/photos/${p.replace(/^\/photos\//,'')}` : null;
}
function fmtDate(iso) {
  return iso ? new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '';
}
function brandLogo(make) { return BRAND_LOGO[make.toLowerCase().trim()] || null; }

let allBadges = [];

async function load() {
  try {
    const res  = await fetch('/api/badges');
    const data = await res.json();
    allBadges  = (data.badges || []).sort((a,b) => {
      const ai = RARITY_ORDER.indexOf(rarity(a)), bi = RARITY_ORDER.indexOf(rarity(b));
      return (ai<0?99:ai)-(bi<0?99:bi);
    });
    renderStats();
    renderFlagMatrix();
  } catch(e) {
    document.getElementById('flag-matrix-view').innerHTML =
      '<div class="loading">Couldn\'t load. Try refreshing!</div>';
  }
}

function renderStats() {
  const total   = allBadges.length;
  const makes   = new Set(allBadges.map(b=>b.make).filter(Boolean)).size;
  const tree    = groupByCountry();
  const countries = Object.keys(tree).length;
  const rares   = allBadges.filter(b=>['rare','ultra-rare'].includes(rarity(b))).length;

  document.getElementById('topbar-stats').innerHTML =
    `<span><strong>${total}</strong> badges</span>
     <span><strong>${makes}</strong> makes</span>
     <span><strong>${countries}</strong> countries</span>`;

  document.getElementById('stat-row').innerHTML = `
    <div class="stat-pill"><div class="stat-pill-val">${total}</div><div class="stat-pill-label">Badges</div></div>
    <div class="stat-pill"><div class="stat-pill-val">${makes}</div><div class="stat-pill-label">Makes</div></div>
    <div class="stat-pill"><div class="stat-pill-val">${countries}</div><div class="stat-pill-label">Countries</div></div>
    <div class="stat-pill"><div class="stat-pill-val">${rares}</div><div class="stat-pill-label">Rare+</div></div>`;
}

function groupByCountry() {
  const tree = {};
  allBadges.forEach(b => {
    const c = getCountry(b.make);
    const m = b.make || 'Unknown';
    if (!tree[c]) tree[c] = {};
    if (!tree[c][m]) tree[c][m] = [];
    tree[c][m].push(b);
  });
  return tree;
}

function renderFlagMatrix() {
  const tree = groupByCountry();
  const countries = Object.keys(tree).sort((a,b)=>(COUNTRY_SORT[a]??99)-(COUNTRY_SORT[b]??99));

  document.getElementById('flag-matrix-view').innerHTML = `
    <div class="flag-matrix">
      ${countries.map(country => flagCardHtml(country, tree[country])).join('')}
    </div>`;
}

function flagCardHtml(country, makeTree) {
  const code   = COUNTRY_FLAG_CODE[country];
  const flagSrc = code
    ? `https://flagcdn.com/w640/${code}.png`
    : `https://flagcdn.com/w640/un.png`;
  const total  = Object.values(makeTree).flat().length;
  const makes  = Object.keys(makeTree).sort();
  const safeId = country.replace(/ /g,'_');

  const brandBtns = makes.map(make => {
    const logo = brandLogo(make);
    const inner = logo
      ? `<img class="brand-btn-logo" src="${logo}" alt="${make}" onerror="this.style.display='none'">`
      : `<div class="brand-btn-letter">${make[0]}</div>`;
    return `<button class="brand-btn" onclick="showBrand(event,'${country}','${make.replace(/'/g,"\\'")}')">
      ${inner}
      <div class="brand-btn-name">${make}</div>
    </button>`;
  }).join('');

  return `
  <div class="flag-card" id="flag-${safeId}" onclick="flipCard('${safeId}')">
    <div class="flag-card-inner">
      <div class="flag-front">
        <img class="flag-img" src="${flagSrc}" alt="${country}"
          onerror="this.src='https://flagcdn.com/w640/un.png'">
        <div class="flag-overlay">
          <div class="flag-country-name">${country}</div>
          <div class="flag-badge-count">${total} badge${total!==1?'s':''} · ${makes.length} make${makes.length!==1?'s':''}</div>
        </div>
        <div class="flag-hint">tap to explore</div>
      </div>
      <div class="flag-back">
        <div class="flag-back-header">${country}</div>
        <div class="brand-grid">${brandBtns}</div>
      </div>
    </div>
  </div>`;
}

function flipCard(safeId) {
  document.getElementById(`flag-${safeId}`).classList.toggle('flipped');
}

function showBrand(e, country, make) {
  e.stopPropagation();
  const badges = allBadges.filter(b => b.make === make);
  if (!badges.length) return;

  // Switch views
  document.getElementById('flag-matrix-view').classList.add('hidden');
  document.getElementById('badge-grid-view').classList.add('visible');

  // Breadcrumb
  const bc = document.getElementById('breadcrumb');
  bc.classList.add('visible');
  document.getElementById('bc-country').textContent = country;
  document.getElementById('bc-sep-2').style.display = 'inline';
  document.getElementById('bc-brand').style.display  = 'inline';
  document.getElementById('bc-brand').textContent    = make;

  // Section heading
  const logo = brandLogo(make);
  document.getElementById('section-heading').innerHTML = `
    ${logo ? `<div class="section-heading-logo"><img src="${logo}" alt="${make}"></div>` : ''}
    <div class="section-heading-text">
      <h2>${make}</h2>
      <p>${badges.length} badge${badges.length!==1?'s':''} in the vault</p>
    </div>`;

  // Badge grid
  document.getElementById('badge-grid').innerHTML = badges.map(b => badgeCardHtml(b)).join('');

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goHome() {
  document.getElementById('flag-matrix-view').classList.remove('hidden');
  document.getElementById('badge-grid-view').classList.remove('visible');
  document.getElementById('breadcrumb').classList.remove('visible');
}

function badgeCardHtml(b) {
  const r    = rarity(b);
  const pUrl = photoUrl(b.photo);
  const img  = pUrl
    ? `<img class="card-img" src="${pUrl}" alt="" loading="lazy" onerror="this.parentNode.innerHTML='<div class=card-img-placeholder>🏅</div>'">`
    : `<div class="card-img-placeholder">🏅</div>`;
  return `
  <div class="badge-card" data-rarity="${r}" onclick="openModal('${b.id}')">
    <div class="card-img-wrap">
      ${img}
      <div class="card-img-gradient"></div>
      <div class="rarity-badge ${r}">${RARITY_LABEL[r]||r}</div>
    </div>
    <div class="card-info">
      <div class="card-badge-name">${b.badge_name||'Unknown Badge'}</div>
      <div class="card-make">${[b.model, b.years].filter(Boolean).join(' · ')}</div>
    </div>
  </div>`;
}

function openModal(id) {
  const b = allBadges.find(x=>x.id===id);
  if (!b) return;
  const r       = rarity(b);
  const pUrl    = photoUrl(b.photo);
  const country = getCountry(b.make);
  const code    = COUNTRY_FLAG_CODE[country];
  const flag    = code ? String.fromCodePoint(...[...code.toUpperCase()].map(c=>c.charCodeAt(0)+127397)) : '🌍';

  const img = document.getElementById('modal-img');
  if (pUrl) { img.src = pUrl; img.style.display = 'block'; }
  else       { img.style.display = 'none'; }

  document.getElementById('modal-img-rarity').textContent = RARITY_LABEL[r]||r;
  document.getElementById('modal-img-rarity').className   = `modal-img-rarity ${r}`;
  document.getElementById('modal-title').textContent      = b.badge_name||'Unknown Badge';
  document.getElementById('modal-make').innerHTML         =
    `<span>${flag}</span> ${[b.make, b.model, b.years].filter(Boolean).join(' · ')}`;
  document.getElementById('modal-chips').innerHTML        =
    (b.added ? `<span class="modal-chip">${fmtDate(b.added)}</span>` : '') +
    (b.confidence ? `<span class="modal-chip">${b.confidence} confidence</span>` : '');
  document.getElementById('modal-desc').textContent  = b.description||'';

  const factWrap = document.getElementById('modal-fact-wrap');
  if (b.fun_fact) {
    document.getElementById('modal-fact').textContent = b.fun_fact;
    factWrap.style.display = 'block';
  } else { factWrap.style.display = 'none'; }

  document.getElementById('modal-bg').classList.add('open');
}

document.getElementById('modal-close').onclick = () =>
  document.getElementById('modal-bg').classList.remove('open');
document.getElementById('modal-bg').onclick = e => {
  if (e.target === document.getElementById('modal-bg'))
    document.getElementById('modal-bg').classList.remove('open');
};
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('modal-bg').classList.remove('open');
});

load();
</script>
</body>
</html>
