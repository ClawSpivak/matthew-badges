<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Badge Vault — Control Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg:     #020917;
  --s1:     #080f24;
  --s2:     #0d1a36;
  --border: rgba(56,110,200,0.18);
  --border2:rgba(96,165,250,0.4);
  --blue:   #3b82f6;
  --blue2:  #60a5fa;
  --blue3:  #93c5fd;
  --text:   #eef4ff;
  --text2:  #7da5d0;
  --text3:  #3d6080;
  --red:    #ef4444;
  --green:  #34d399;
  --amber:  #f59e0b;
}
body {
  background: var(--bg); color: var(--text);
  font-family: 'Inter', sans-serif; min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── TOP BAR ── */
.topbar {
  background: rgba(2,9,23,0.9); backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 20px; height: 60px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 50;
}
.topbar-title { font-size: 1rem; font-weight: 800; letter-spacing: -0.3px; }
.topbar-title span { color: var(--blue2); }
.topbar-count { font-size: 0.78rem; color: var(--text3); font-weight: 600; }

/* ── FILTER BAR ── */
.filter-bar {
  padding: 14px 16px 0;
  position: sticky; top: 60px; z-index: 40;
  background: rgba(2,9,23,0.95); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding-bottom: 12px;
}
.filter-scroll {
  display: flex; gap: 8px;
  overflow-x: auto; scrollbar-width: none;
  padding-bottom: 2px;
}
.filter-scroll::-webkit-scrollbar { display: none; }
.filter-chip {
  display: flex; align-items: center; gap: 5px;
  padding: 7px 14px; border-radius: 20px;
  border: 1px solid var(--border);
  font-size: 0.75rem; font-weight: 600;
  color: var(--text2); white-space: nowrap;
  cursor: pointer; transition: all 0.15s;
  background: transparent; flex-shrink: 0;
}
.filter-chip:hover { border-color: var(--border2); color: var(--text); }
.filter-chip.active {
  background: rgba(59,130,246,0.15);
  border-color: rgba(96,165,250,0.4);
  color: var(--blue2);
}
.filter-chip .chip-count {
  background: rgba(59,130,246,0.12);
  color: var(--blue2); border-radius: 10px;
  font-size: 0.65rem; font-weight: 700;
  padding: 1px 6px;
}
.filter-chip.active .chip-count { background: rgba(96,165,250,0.2); }

/* ── MAIN ── */
main { padding: 16px 16px 80px; max-width: 700px; margin: 0 auto; }

/* ── SECTION ── */
.section-label {
  font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 1.5px; color: var(--text3);
  margin: 20px 0 10px; padding-left: 2px;
}

/* ── BADGE LIST ── */
.badge-list { display: flex; flex-direction: column; gap: 10px; }

/* ── BADGE ROW ── */
.badge-row {
  display: flex; align-items: center; gap: 14px;
  background: rgba(8,20,50,0.7);
  border: 1px solid var(--border);
  border-radius: 14px; padding: 12px 14px;
  transition: border-color 0.15s, opacity 0.2s;
}
.badge-row:hover { border-color: var(--border2); }
.badge-row.deleting { opacity: 0.3; pointer-events: none; }
.badge-row.deleted  { display: none; }
.badge-row.hidden-filter { display: none; }

/* ── THUMB ── */
.thumb {
  width: 64px; height: 64px; border-radius: 10px;
  object-fit: cover; flex-shrink: 0;
  cursor: pointer; transition: opacity 0.15s;
  border: 1px solid var(--border);
}
.thumb:hover { opacity: 0.8; }
.thumb-placeholder {
  width: 64px; height: 64px; border-radius: 10px;
  background: var(--s2); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; flex-shrink: 0;
}

/* ── BADGE INFO ── */
.badge-info { flex: 1; min-width: 0; }
.badge-name {
  font-size: 0.9rem; font-weight: 700; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 3px;
}
.badge-meta { font-size: 0.72rem; color: var(--text2); margin-bottom: 6px; }
.badge-actions { display: flex; gap: 6px; flex-wrap: wrap; }

/* ── RARITY ── */
.rarity-tag {
  font-size: 0.6rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.5px; padding: 2px 7px; border-radius: 5px;
  display: inline-block; margin-bottom: 4px;
}
.rarity-common     { background: rgba(30,50,80,0.6); color: var(--text3); }
.rarity-uncommon   { background: rgba(34,211,238,0.1); color: #22d3ee; border: 1px solid rgba(34,211,238,0.25); }
.rarity-rare       { background: rgba(245,158,11,0.1); color: #fbbf24; border: 1px solid rgba(245,158,11,0.25); }
.rarity-ultra-rare { background: rgba(232,121,249,0.1); color: #e879f9; border: 1px solid rgba(232,121,249,0.25); }
.rarity-unknown    { background: var(--s2); color: var(--text3); border: 1px solid var(--border); }

/* ── BUTTONS ── */
.btn {
  font-size: 0.72rem; font-weight: 700;
  padding: 6px 13px; border-radius: 8px;
  border: 1px solid; cursor: pointer;
  transition: all 0.15s; white-space: nowrap;
  min-height: 34px;
}
.btn-rescan {
  background: rgba(59,130,246,0.08); color: var(--blue2);
  border-color: rgba(59,130,246,0.3);
}
.btn-rescan:hover { background: rgba(59,130,246,0.2); border-color: var(--blue2); }
.btn-rescan.scanning {
  opacity: 0.5; pointer-events: none;
  animation: pulse 1s ease-in-out infinite;
}
.btn-delete {
  background: rgba(239,68,68,0.08); color: #fca5a5;
  border-color: rgba(239,68,68,0.25);
}
.btn-delete:hover { background: rgba(239,68,68,0.2); border-color: var(--red); }
@keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:0.2} }

/* ── PHOTO PICKER ── */
.photo-picker {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.92); backdrop-filter: blur(12px);
  z-index: 300; align-items: center; justify-content: center; padding: 20px;
}
.photo-picker.open { display: flex; }
.photo-picker-box {
  background: var(--s1); border: 1px solid var(--border2);
  border-radius: 18px; padding: 22px; max-width: 640px; width: 100%;
}
.photo-picker-title {
  font-size: 0.9rem; font-weight: 700; margin-bottom: 18px;
  color: var(--text);
}
.photo-picker-title span { color: var(--text3); font-weight: 400; }
.photo-picker-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.photo-option {
  border: 2px solid var(--border); border-radius: 10px;
  overflow: hidden; cursor: pointer; transition: border-color 0.15s;
}
.photo-option:hover { border-color: var(--border2); }
.photo-option.active { border-color: var(--blue2); }
.photo-option img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
.photo-option-label {
  padding: 8px 10px; font-size: 0.7rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.5px; color: var(--text2);
  display: flex; align-items: center; justify-content: space-between;
}
.photo-option.active .photo-option-label { color: var(--blue2); }
.active-badge {
  font-size: 0.62rem; background: rgba(59,130,246,0.15);
  color: var(--blue2); border: 1px solid rgba(96,165,250,0.3);
  padding: 1px 6px; border-radius: 4px;
}
.photo-picker-actions { display: flex; gap: 8px; justify-content: flex-end; }
.btn-cancel {
  background: var(--s2); color: var(--text2);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 16px; font-size: 0.78rem; font-weight: 600;
  cursor: pointer; transition: all 0.15s;
}
.btn-cancel:hover { background: var(--border); color: var(--text); }
.btn-apply {
  background: rgba(59,130,246,0.15); color: var(--blue2);
  border: 1px solid rgba(96,165,250,0.3); border-radius: 8px;
  padding: 8px 16px; font-size: 0.78rem; font-weight: 700;
  cursor: pointer; transition: all 0.15s;
}
.btn-apply:hover { background: rgba(59,130,246,0.3); }
.btn-apply:disabled { opacity: 0.35; pointer-events: none; }

/* ── LIGHTBOX ── */
.lightbox {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.94); backdrop-filter: blur(16px);
  z-index: 400; align-items: center; justify-content: center; cursor: zoom-out;
}
.lightbox.open { display: flex; }
.lightbox img {
  max-width: min(92vw, 800px); max-height: 88vh;
  border-radius: 12px; object-fit: contain;
  box-shadow: 0 24px 80px rgba(0,0,0,0.8);
}
.lightbox-close {
  position: fixed; top: 18px; right: 18px;
  background: rgba(8,20,50,0.9); border: 1px solid var(--border2);
  color: var(--blue2); border-radius: 10px; width: 40px; height: 40px;
  font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--s1); border: 1px solid var(--border);
  border-radius: 12px; padding: 10px 20px;
  font-size: 0.85rem; font-weight: 600;
  opacity: 0; transition: opacity 0.2s;
  pointer-events: none; z-index: 500; white-space: nowrap;
}
.toast.show { opacity: 1; }
.toast.ok  { border-color: rgba(52,211,153,0.4); color: var(--green); }
.toast.err { border-color: rgba(239,68,68,0.4);  color: var(--red); }

.spinner {
  width: 32px; height: 32px; border: 2px solid var(--border);
  border-top-color: var(--blue2); border-radius: 50%;
  animation: spin 0.7s linear infinite; margin: 60px auto;
}
@keyframes spin { to { transform: rotate(360deg); } }
.empty-state { text-align: center; padding: 40px; color: var(--text3); font-size: 0.88rem; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">Badge Vault <span>Control Panel</span></div>
  <div class="topbar-count" id="topbar-count"></div>
</div>

<div class="filter-bar">
  <div class="filter-scroll" id="filter-bar"></div>
</div>

<main>
  <div id="unidentified-section" style="display:none">
    <div class="section-label">⚠️ Needs attention</div>
    <div class="badge-list" id="unidentified-list"></div>
  </div>
  <div class="section-label" id="all-label">All badges</div>
  <div class="badge-list" id="all-list"><div class="spinner"></div></div>
</main>

<div class="toast" id="toast"></div>

<!-- Photo picker -->
<div class="photo-picker" id="photo-picker">
  <div class="photo-picker-box">
    <div class="photo-picker-title">Choose photo — <span id="picker-badge-name"></span></div>
    <div class="photo-picker-grid">
      <div class="photo-option" id="opt-original" onclick="selectVersion('original')">
        <img id="picker-img-original" src="" alt="">
        <div class="photo-option-label">Original <span id="original-active-badge"></span></div>
      </div>
      <div class="photo-option" id="opt-processed" onclick="selectVersion('processed')">
        <img id="picker-img-processed" src="" alt="">
        <div class="photo-option-label">BG Removed <span id="processed-active-badge"></span></div>
      </div>
    </div>
    <div class="photo-picker-actions">
      <button class="btn-cancel" onclick="closePicker()">Cancel</button>
      <button class="btn-apply" id="btn-apply" onclick="applyVersion()">Use selected</button>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close">✕</button>
  <img id="lightbox-img" src="" alt="">
</div>

<script>
let badges = [];
let activeMake = 'all';

async function load() {
  const res  = await fetch('/api/collection');
  const data = await res.json();
  badges = data.badges || [];
  render();
}

function isUnidentified(b) {
  return !b.make || b.make === 'Unknown' || !b.badge_name || b.badge_name === 'Unidentified Badge';
}
function rarity(b) {
  return (b.rarity || 'unknown').toLowerCase().replace(/[\s_]+/g,'-');
}

function render() {
  const total = badges.length;
  document.getElementById('topbar-count').textContent = `${total} badge${total !== 1 ? 's' : ''}`;

  // Build make filter chips
  const makes = ['all', ...Array.from(new Set(badges.filter(b => !isUnidentified(b)).map(b => b.make).filter(Boolean))).sort()];
  document.getElementById('filter-bar').innerHTML = makes.map(m => {
    const count = m === 'all' ? badges.filter(b => !isUnidentified(b)).length : badges.filter(b => b.make === m).length;
    return `<button class="filter-chip${m === activeMake ? ' active' : ''}" onclick="setMake('${m.replace(/'/g,"\\'")}')">
      ${m === 'all' ? 'All' : m} <span class="chip-count">${count}</span>
    </button>`;
  }).join('');

  // Unidentified section
  const unid = badges.filter(isUnidentified);
  const unidSection = document.getElementById('unidentified-section');
  if (unid.length) {
    unidSection.style.display = 'block';
    document.getElementById('unidentified-list').innerHTML = unid.map(rowHtml).join('');
  } else {
    unidSection.style.display = 'none';
  }

  // All badges
  const rest = badges.filter(b => !isUnidentified(b));
  const label = activeMake === 'all' ? 'All badges' : activeMake;
  document.getElementById('all-label').textContent = label;
  document.getElementById('all-list').innerHTML = rest.length
    ? rest.map(rowHtml).join('')
    : '<div class="empty-state">No badges yet.</div>';

  applyFilter();
  attachHandlers();
}

function setMake(make) {
  activeMake = make;
  document.querySelectorAll('.filter-chip').forEach(c => {
    c.classList.toggle('active', c.textContent.trim().startsWith(make === 'all' ? 'All' : make));
  });
  document.getElementById('all-label').textContent = make === 'all' ? 'All badges' : make;
  applyFilter();
}

function applyFilter() {
  document.querySelectorAll('#all-list .badge-row').forEach(row => {
    const make = row.dataset.make || '';
    row.classList.toggle('hidden-filter', activeMake !== 'all' && make !== activeMake);
  });
}

function rowHtml(b) {
  const r    = rarity(b);
  const name = b.badge_name || 'Unidentified Badge';
  const meta = [b.make, b.model, b.years].filter(Boolean).join(' · ') || 'Unknown';
  const date = b.added ? new Date(b.added).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '';
  const img  = b.photo
    ? `<img class="thumb" src="${b.photo}" alt="" onclick="openPicker('${b.id}')" onerror="this.style.display='none'">`
    : `<div class="thumb-placeholder">🏅</div>`;

  return `
  <div class="badge-row" id="row-${b.id}" data-make="${b.make || ''}">
    ${img}
    <div class="badge-info">
      <div class="rarity-tag rarity-${r}">${b.rarity || 'unknown'}</div>
      <div class="badge-name">${name}</div>
      <div class="badge-meta">${meta}${date ? ' · ' + date : ''}</div>
      <div class="badge-actions">
        <button class="btn btn-rescan" data-id="${b.id}">Rescan</button>
        <button class="btn btn-delete" data-id="${b.id}">Delete</button>
      </div>
    </div>
  </div>`;
}

function attachHandlers() {
  document.querySelectorAll('.btn-rescan').forEach(btn => {
    btn.onclick = async () => {
      const id  = btn.dataset.id;
      btn.classList.add('scanning');
      btn.textContent = 'Scanning…';
      try {
        const res    = await fetch('/api/reidentify', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id}) });
        const result = await res.json();
        if (result.error) throw new Error(result.error);
        const upd  = await fetch(`/api/badge/${id}/update`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({badge: result}) });
        const saved = await upd.json();
        if (!saved.ok) throw new Error('Save failed');
        const idx = badges.findIndex(b => b.id === id);
        if (idx >= 0) badges[idx] = { ...badges[idx], ...result };
        render();
        showToast(`Rescanned: ${result.badge_name || 'updated'}`, 'ok');
      } catch(e) {
        btn.classList.remove('scanning');
        btn.textContent = 'Rescan';
        showToast('Rescan failed: ' + e.message, 'err');
      }
    };
  });

  document.querySelectorAll('.btn-delete').forEach(btn => {
    btn.onclick = async () => {
      const id  = btn.dataset.id;
      const row = document.getElementById(`row-${id}`);
      const name = row.querySelector('.badge-name').textContent;
      if (!confirm(`Delete "${name}"?`)) return;
      row.classList.add('deleting');
      try {
        const res  = await fetch(`/api/badge/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.ok) {
          row.classList.add('deleted');
          badges = badges.filter(b => b.id !== id);
          document.getElementById('topbar-count').textContent = `${badges.length} badges`;
          showToast(`"${name}" deleted`, 'ok');
        } else {
          row.classList.remove('deleting');
          showToast('Delete failed', 'err');
        }
      } catch(e) {
        row.classList.remove('deleting');
        showToast('Error: ' + e.message, 'err');
      }
    };
  });
}

// ── Photo picker ──
let pickerBadgeId = null, pickerSelected = null, pickerCurrent = 'processed';

function openPicker(badgeId) {
  const b = badges.find(x => x.id === badgeId);
  if (!b || !b.photo) { openLightbox(badges.find(x=>x.id===badgeId)?.photo); return; }
  pickerBadgeId = badgeId; pickerSelected = null;
  const filename = b.photo.replace(/^\/photos\//, '');
  document.getElementById('picker-badge-name').textContent = b.badge_name || 'Badge';
  document.getElementById('picker-img-original').src  = `/photos_original/${filename}?t=${Date.now()}`;
  document.getElementById('picker-img-processed').src = `/photos_processed/${filename}?t=${Date.now()}`;
  const row = document.getElementById(`row-${badgeId}`);
  pickerCurrent = row?.dataset.photoVersion || 'processed';
  document.getElementById('original-active-badge').innerHTML  = pickerCurrent === 'original'  ? '<span class="active-badge">Active</span>' : '';
  document.getElementById('processed-active-badge').innerHTML = pickerCurrent === 'processed' ? '<span class="active-badge">Active</span>' : '';
  document.getElementById('opt-original').classList.toggle('active',  pickerCurrent === 'original');
  document.getElementById('opt-processed').classList.toggle('active', pickerCurrent === 'processed');
  document.getElementById('btn-apply').disabled = true;
  document.getElementById('photo-picker').classList.add('open');
}

function selectVersion(v) {
  pickerSelected = v;
  document.getElementById('opt-original').classList.toggle('active', v === 'original');
  document.getElementById('opt-processed').classList.toggle('active', v === 'processed');
  document.getElementById('btn-apply').disabled = (v === pickerCurrent);
}

async function applyVersion() {
  if (!pickerSelected || pickerSelected === pickerCurrent) { closePicker(); return; }
  const btn = document.getElementById('btn-apply');
  btn.textContent = 'Applying…'; btn.disabled = true;
  try {
    const res  = await fetch(`/api/badge/${pickerBadgeId}/use-photo`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({version: pickerSelected}) });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Failed');
    const row = document.getElementById(`row-${pickerBadgeId}`);
    if (row) {
      row.dataset.photoVersion = pickerSelected;
      const thumb = row.querySelector('.thumb');
      const fn = badges.find(b=>b.id===pickerBadgeId)?.photo?.replace(/^\/photos\//,'');
      if (thumb && fn) thumb.src = `/photos/${fn}?t=${Date.now()}`;
    }
    showToast(`Photo updated`, 'ok');
    closePicker();
  } catch(e) {
    btn.textContent = 'Use selected'; btn.disabled = false;
    showToast('Error: ' + e.message, 'err');
  }
}

function closePicker() {
  document.getElementById('photo-picker').classList.remove('open');
  document.getElementById('btn-apply').textContent = 'Use selected';
}

// ── Lightbox ──
function openLightbox(src) {
  if (!src) return;
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }
document.getElementById('lightbox-close').onclick = closeLightbox;
document.getElementById('lightbox').onclick = e => { if (e.target === document.getElementById('lightbox')) closeLightbox(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeLightbox(); closePicker(); } });

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast show ${type}`;
  setTimeout(() => t.className = 'toast', 3000);
}

load();
</script>
</body>
</html>
